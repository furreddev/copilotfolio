<!DOCTYPE html>

    <title>Epix Secret</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;

        color: #ffbd6c;
      }

  </head>
  <body>
    <section class="panel">
      <h1>Welcome to Epix's secret page ✨</h1>
