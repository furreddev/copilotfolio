<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Epix</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      integrity="sha512-SnH5WK+bZxgPHs44uWix+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkR4j8QxihfU7V1L0Xbgc7PoWv4r5R9EJfNQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="bg-layer" aria-hidden="true"></div>
    <div class="bg-overlay" aria-hidden="true"></div>

    <main class="page" id="page">
      <section class="card parallax" data-depth="0.06">
        <header class="hero">
          <div class="avatar-wrap">
            <img id="avatar" class="avatar" alt="Epix avatar" />
            <img id="avatarDecoration" class="avatar-decoration hidden" alt="Avatar decoration" />
          </div>
          <div class="hero-meta">
            <h1 id="displayName">Epix</h1>
            <p class="subtitle terminal-line">whoami</p>
            <p id="guildTag" class="meta-line terminal-line"></p>
            <p id="discordStatus" class="meta-line terminal-line">Loading Discord status...</p>
          </div>
        </header>

        <section class="live-panel parallax" data-depth="0.1">
          <div class="status-pill" id="statusPill">
            <span class="status-dot"></span>
            <span id="statusText">offline</span>
          </div>
          <p id="activityText" class="activity terminal-line">No activity</p>
          <a id="discordProfileLink" class="glass-btn" href="#" target="_blank" rel="noreferrer">View Discord</a>
        </section>

        <nav class="links parallax" data-depth="0.14" id="socialLinks" aria-label="Social links">
          <span class="liquid-slider" id="liquidSlider" aria-hidden="true"></span>
        </nav>

        <p id="secretHint" class="secret hidden">🔐 Secret unlocked: <a href="./epixssecret/">/epixssecret</a></p>
      </section>

      <section class="player parallax" data-depth="0.12">
        <button id="musicToggle" class="icon-btn" aria-label="Toggle music">
          <i class="fa-solid fa-volume-high"></i>
        </button>
        <div class="track-meta">
          <p id="trackTitle" class="terminal-line">Now playing: Epix Theme</p>
          <p id="trackTime" class="terminal-line">0:00</p>
        </div>
        <audio id="audio" preload="metadata" loop></audio>
      </section>
    </main>

    <script src="./script.js" type="module"></script>
  </body>
</html>
